name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # git hooks are for local commits only
      REDIS_TEST_URL: redis://localhost:6379 # enables apps/api/test/redis.integration.test.ts
      DATABASE_TEST_URL: postgresql://weather:weather@localhost:5432/weather_test # enables apps/api/test/db.integration.test.ts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test:run build
