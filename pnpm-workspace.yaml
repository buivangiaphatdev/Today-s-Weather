packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts by default; allow only these
onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild

# Only resolve versions published at least 14 days ago (minutes), so a freshly
# hijacked release is usually caught and pulled before it reaches this repo
minimumReleaseAge: 20160
